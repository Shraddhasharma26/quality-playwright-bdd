name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 12:00 AM IST (Midnight India Time = 18:30 UTC):
    - cron: '30 18 * * *'
    # Alternatively, for 12:00 AM UTC (Midnight UTC), uncomment below:
    # - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual trigger from GitHub Actions UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox , anonymous, authenticated]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Generate BDD runner spec files
        run: npm run bdd:gen

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: npx playwright test --config=playwright.service.config.js --project=${{ matrix.browser }} --workers=4

      - name: Generate Allure report
        if: always()
        run: npx allure generate ./allure-results --clean -o allure-report

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          retention-days: 30

  publish-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all Allure reports
        uses: actions/download-artifact@v4
        with:
          pattern: allure-report-*
          path: downloaded-reports/
          merge-multiple: true